<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16213A">
<title>Repayment / Salary Dashboard</title>
<style>body{margin:0;font:15px system-ui,Segoe UI,Arial,sans-serif;background:#EEF1F5;color:#5E6B82;display:flex;align-items:center;justify-content:center;min-height:100vh}
button{margin-top:12px;padding:8px 16px;border-radius:6px;border:1px solid #16213A;background:#16213A;color:#fff;font:inherit;cursor:pointer}</style>
</head>
<body>
<div id="msg" style="text-align:center">Dashboard load ho raha hai…</div>
<script>
// Ye file GitHub pe sirf ek baar daalni hai. Dashboard ka saara code Apps Script ki "Index" file se aata hai.
(function(){
const LOADER_API='https://script.google.com/macros/s/AKfycbxvkt4joYOD_fRAh-jeo3pD4PP87MrUnMifvNfww6qWy72lmq1mEFZJVFMkXWBAPWFF/exec';
fetch(LOADER_API + '?api=page', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error('Server ' + r.status); return r.text(); })
  .then(html => { if (html.indexOf('<html') < 0) throw new Error('Dashboard nahi mila'); document.open(); document.write(html); document.close(); })
  .catch(e => { document.getElementById('msg').innerHTML = 'Dashboard load nahi hua (' + e.message + ').<br><button onclick="location.reload()">Dobara try karo</button>'; });
})();
</script>
</body>
</html>
